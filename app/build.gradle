apply plugin: 'com.android.application'

android {
    namespace "com.android.support"
    compileSdk 34
    buildToolsVersion "34.0.0"
    ndkVersion "27.0.12077973"
    defaultConfig {
        applicationId "com.android.support"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "3.4"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        externalNativeBuild {
            ndkBuild {
                arguments "-j" + Runtime.runtime.availableProcessors()
            }
        }
        signingConfig signingConfigs.debug
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }
    packaging {
        jniLibs {
            pickFirsts += ['**/libTool.so']
        }
    }
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << "-Xlint:deprecation"
    }
}

//dependencies must be placed below 'android' brackets to get it work on AIDE
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.annotation:annotation:1.7.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.20'
    def shizuku_version = '13.1.5'
    implementation("dev.rikka.shizuku:api:${shizuku_version}") {
        exclude group: 'androidx.annotation', module: 'annotation'
    }
    implementation("dev.rikka.shizuku:provider:${shizuku_version}") {
        exclude group: 'androidx.annotation', module: 'annotation'
    }
}

afterEvaluate {
    tasks.matching { it.name.startsWith('process') && it.name.endsWith('Manifest') && !it.name.contains('Main') }.configureEach { task ->
        def mainTaskName = task.name.replace('Manifest', 'MainManifest')
        def mainTask = tasks.findByName(mainTaskName)
        if (mainTask != null) {
            task.dependsOn(mainTask)
            task.mustRunAfter(mainTask)
        }
    }
}
