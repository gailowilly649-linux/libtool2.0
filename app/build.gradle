apply plugin: 'com.android.application'

android {
    compileSdkVersion 34
    buildToolsVersion "34.0.0"
    ndkVersion "27.0.12077973"
    defaultConfig {
        applicationId "com.android.support"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "3.2"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        signingConfig signingConfigs.debug
    }
    buildTypes {
        release {
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libTool.so']
        }
    }
    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:deprecation"
    }
}

//dependencies must be placed below 'android' brackets to get it work on AIDE
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    compileOnly 'androidx.annotation:annotation:1.3.0'
    def shizuku_version = '13.1.5'
    implementation "dev.rikka.shizuku:api:${shizuku_version}"
    implementation "dev.rikka.shizuku:provider:${shizuku_version}"
}

afterEvaluate {
    tasks.matching { it.name.startsWith('process') && it.name.endsWith('Manifest') && !it.name.contains('Main') }.configureEach { task ->
        def mainTaskName = task.name.replace('Manifest', 'MainManifest')
        def mainTask = tasks.findByName(mainTaskName)
        if (mainTask != null) {
            task.dependsOn(mainTask)
            task.mustRunAfter(mainTask)
        }
    }
}
